<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Cursos - UniFATIX</title>
    <!-- Tailwind CSS para estilização rápida e responsiva -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 min-h-screen">

    <!-- Cabeçalho -->
    <header class="bg-blue-900 text-white shadow-md py-4 px-6 flex justify-between items-center">
        <h1 class="text-2xl font-bold">UniFATIX - Catálogo de Cursos</h1>
        <a href="../index.html" class="bg-blue-700 hover:bg-blue-600 px-4 py-2 rounded text-sm transition">Voltar ao Portal</a>
    </header>

    <!-- Conteúdo Principal -->
    <main class="max-w-7xl mx-auto px-6 py-8">
        <h2 class="text-3xl font-bold text-gray-800 mb-6">Nossos Cursos e Pós-Graduações</h2>

        <!-- Grid onde os cursos serão injetados via JavaScript -->
        <div id="cursos-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Os cards dos cursos aparecerão aqui dinamicamente -->
            <p class="text-gray-500 col-span-full text-center py-10">Carregando cursos do sistema...</p>
        </div>
    </main>

    <!-- Script de Conexão e Renderização -->
    <script type="module">
        // Importe ou inicialize o seu cliente Supabase (ajuste o caminho conforme sua estrutura)
        import { supabase } from '../supabase.js'; // ou use as credenciais diretas se preferir

        async function carregarCursos() {
            const container = document.getElementById('cursos-grid');

            try {
                // Busca os cursos na tabela 'cursos' do Supabase ordenada por título
                const { data: cursos, error } = await supabase
                    .from('cursos')
                    .select('*')
                    .order('titulo', { ascending: true });

                if (error) {
                    throw error;
                }

                if (!cursos || cursos.length === 0) {
                    container.innerHTML = `<p class="text-gray-500 col-span-full text-center py-10">Nenhum curso cadastrado no momento.</p>`;
                    return;
                }

                // Limpa o container e renderiza os cards
                container.innerHTML = '';
                cursos.forEach(curso => {
                    const card = document.createElement('div');
                    card.className = "bg-white rounded-lg shadow-md p-6 flex flex-col justify-between border border-gray-200 hover:shadow-lg transition";
                    card.innerHTML = `
                        <div>
                            <span class="text-xs font-semibold bg-blue-100 text-blue-800 py-1 px-3 rounded-full uppercase">${curso.carga_horaria} Horas</span>
                            <h3 class="text-xl font-bold text-gray-900 mt-4 mb-2">${curso.titulo}</h3>
                            <p class="text-gray-600 text-sm mb-4">${curso.descricao || 'Sem descrição informada.'}</p>
                        </div>
                        <a href="curso.html?id=${curso.id}" class="mt-auto bg-blue-600 hover:bg-blue-700 text-white text-center py-2 px-4 rounded font-medium transition">
                            Acessar Curso
                        </a>
                    `;
                    container.appendChild(card);
                });

            } catch (err) {
                console.error('Erro ao buscar cursos:', err.message);
                container.innerHTML = `<p class="text-red-500 col-span-full text-center py-10">Erro ao carregar os cursos. Verifique a conexão com o banco.</p>`;
            }
        }

        // Executa a função ao carregar a página
        carregarCursos();
    </script>
</body>
</html>
