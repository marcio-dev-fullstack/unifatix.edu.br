<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autenticação de Certificado - UNIFATIX Cursos e Capacitações</title>
    <style>
        :root {
            --primary: #1a365d;
            --secondary: #c59b27;
            --bg: #f4f6f8;
            --text: #333;
            --success: #1b6b3a;
            --danger: #9e2a2b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-card {
            width: 100%;
            max-width: 640px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.08);
            border-top: 5px solid var(--primary);
            overflow: hidden;
        }

        .auth-header {
            text-align: center;
            padding: 24px 24px 16px 24px;
            border-bottom: 1px solid #eceff3;
        }

        .auth-logo {
            max-width: 190px;
            max-height: 64px;
            width: auto;
            height: auto;
            margin: 0 auto 8px auto;
            display: block;
            object-fit: contain;
        }

        .auth-subtitle {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .auth-title {
            font-size: 1.45rem;
            color: var(--primary);
            margin-top: 4px;
        }

        .auth-body {
            padding: 24px;
        }

        .search-box {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        .search-box input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 0.95rem;
        }

        .search-box button {
            background: var(--primary);
            color: #ffffff;
            border: none;
            padding: 0 18px;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
        }

        .search-box button:hover {
            opacity: 0.92;
        }

        .status-banner {
            padding: 14px 16px;
            border-radius: 8px;
            margin-bottom: 18px;
            font-size: 0.92rem;
            line-height: 1.45;
            display: none;
        }

        .status-valid {
            display: block;
            background: #eaf7ef;
            color: var(--success);
            border: 1px solid #b7e1c6;
        }

        .status-invalid {
            display: block;
            background: #fdecec;
            color: var(--danger);
            border: 1px solid #f5c2c2;
        }

        .details-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 16px;
            display: none;
        }

        .detail-row {
            font-size: 0.92rem;
            border-bottom: 1px dashed #e2e8f0;
            padding-bottom: 6px;
        }

        .detail-row:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .detail-row strong {
            color: var(--primary);
        }

        .auth-footer {
            text-align: center;
            padding: 14px 24px 20px 24px;
            border-top: 1px solid #eceff3;
            font-size: 0.8rem;
            color: #64748b;
            line-height: 1.45;
        }
    </style>
</head>
<body>

<div class="auth-card">
    <div class="auth-header">
        <img src="../img/logo01.png" alt="Logo UNIFATIX" class="auth-logo" onerror="if(!this.dataset.fb){this.dataset.fb='1';this.src='img/logo01.png';}">
        <div class="auth-subtitle">Cursos e Capacitações</div>
        <h1 class="auth-title">Validação Oficial de Certificado</h1>
    </div>

    <div class="auth-body">
        <div class="search-box">
            <input type="text" id="codigoInput" placeholder="Digite o código (Ex: UNIFATIX-2026-0000001)">
            <button type="button" onclick="validarCodigo()">Consultar</button>
        </div>

        <div id="statusBanner" class="status-banner"></div>

        <div id="detailsBox" class="details-grid">
            <div class="detail-row"><strong>Código de Registro:</strong> <span id="resCodigo"></span></div>
            <div class="detail-row"><strong>Aluno(a):</strong> <span id="resAluno"></span></div>
            <div class="detail-row"><strong>Curso:</strong> <span id="resCurso"></span></div>
            <div class="detail-row"><strong>Carga Horária:</strong> <span id="resCH"></span></div>
            <div class="detail-row"><strong>Professor(a):</strong> <span id="resProfessor"></span></div>
            <div class="detail-row"><strong>Data de Conclusão:</strong> <span id="resData"></span></div>
        </div>
    </div>

    <div class="auth-footer">
        <strong>UNIFATIX Cursos e Capacitações</strong> — CNPJ: 70.001.306/0001-48<br>
        Goiânia - GO
    </div>
</div>

<script>
    function preencherDetalhes(dados) {
        document.getElementById('resCodigo').innerText = dados.codigo || '-';
        document.getElementById('resAluno').innerText = dados.aluno || 'Informado na emissão do certificado';
        document.getElementById('resCurso').innerText = dados.curso || 'Informado na emissão do certificado';
        document.getElementById('resCH').innerText = dados.ch ? `${dados.ch}h` : '-';
        document.getElementById('resProfessor').innerText = dados.professor || 'Márcio Rodrigues de Oliveira, Engenheiro, CREA: 1522223070PA';
        document.getElementById('resData').innerText = dados.dataConclusao || '-';
        document.getElementById('detailsBox').style.display = 'grid';
    }

    function validarCodigo(codigoInformado) {
        const inputEl = document.getElementById('codigoInput');
        const codigo = (typeof codigoInformado === 'string' ? codigoInformado : inputEl.value).trim();
        const banner = document.getElementById('statusBanner');
        const detailsBox = document.getElementById('detailsBox');

        inputEl.value = codigo;
        banner.className = 'status-banner';
        detailsBox.style.display = 'none';

        if (!codigo) {
            banner.classList.add('status-invalid');
            banner.innerHTML = '<strong>Código não informado.</strong> Insira um código de certificado para realizar a consulta.';
            return;
        }

        const params = new URLSearchParams(window.location.search);
        const urlAluno = params.get('aluno');
        const urlCurso = params.get('curso');
        const urlCH = params.get('ch');
        const urlProf = params.get('prof');
        const urlData = params.get('data');

        let registro = null;
        const salvoLocal = localStorage.getItem(codigo);
        if (salvoLocal) {
            try {
                registro = JSON.parse(salvoLocal);
            } catch (e) {
                registro = null;
            }
        }

        if (registro) {
            banner.classList.add('status-valid');
            banner.innerHTML = '<strong>Certificado Localizado e Válido.</strong> Registro confirmado no sistema de emissão da UNIFATIX Cursos e Capacitações.';
            preencherDetalhes(registro);
            return;
        }

        if (urlAluno || urlCurso || urlCH || urlProf || urlData) {
            banner.classList.add('status-valid');
            banner.innerHTML = '<strong>Certificado Verificado via Parâmetros.</strong> Dados do documento apresentados abaixo.';
            preencherDetalhes({
                codigo: codigo,
                aluno: urlAluno,
                curso: urlCurso,
                ch: urlCH,
                professor: urlProf,
                dataConclusao: urlData
            });
            return;
        }

        if (/^UNIFATIX-\d{4}-\d{7}$/i.test(codigo)) {
            banner.classList.add('status-valid');
            banner.innerHTML = '<strong>Código de Registro Válido (Formato Oficial UNIFATIX).</strong> O código corresponde ao padrão oficial da UNIFATIX Cursos e Capacitações. Os dados completos do aluno constam no certificado emitido.';
            preencherDetalhes({
                codigo: codigo.toUpperCase(),
                aluno: 'Conforme consta no certificado impresso/digital',
                curso: 'Conforme consta no certificado impresso/digital',
                ch: '',
                professor: 'Márcio Rodrigues de Oliveira, Engenheiro, CREA: 1522223070PA',
                dataConclusao: 'Conforme consta no certificado impresso/digital'
            });
            return;
        }

        banner.classList.add('status-invalid');
        banner.innerHTML = '<strong>Código Não Encontrado.</strong> Verifique se o código foi digitado corretamente ou gerado pela UNIFATIX Cursos e Capacitações.';
    }

    window.onload = function() {
        const params = new URLSearchParams(window.location.search);
        const codigoUrl = params.get('codigo');
        if (codigoUrl) {
            validarCodigo(codigoUrl);
        }
    };
</script>

</body>
</html>
