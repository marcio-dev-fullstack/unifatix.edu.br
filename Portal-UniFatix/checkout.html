<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - UniFATIX</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-6">

    <div class="max-w-xl w-full bg-white rounded-2xl shadow-xl border border-slate-200 p-8">
        
        <!-- Cabeçalho do Checkout -->
        <div class="flex justify-between items-center border-b pb-4 mb-6">
            <div>
                <span class="text-xs font-bold text-blue-600 uppercase tracking-wider">Ambiente de Testes / Sandbox</span>
                <h1 class="text-2xl font-extrabold text-slate-900 mt-1">Checkout UniFATIX</h1>
            </div>
            <a href="catalogo-completo.html" class="text-sm text-slate-500 hover:text-slate-800">Voltar</a>
        </div>

        <!-- Resumo do Pedido -->
        <div id="loading-curso" class="text-center py-8 text-slate-500">Carregando detalhes do curso...</div>

        <div id="detalhes-pedido" class="hidden space-y-6">
            <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
                <span id="curso-carga" class="text-xs font-bold bg-blue-100 text-blue-800 px-2.5 py-1 rounded">-- Horas</span>
                <h2 id="curso-titulo" class="text-lg font-bold text-slate-900 mt-2">Nome do Curso</h2>
                <div class="flex justify-between items-center mt-4 pt-4 border-t border-slate-200">
                    <span class="text-sm text-slate-600 font-medium">Valor Total:</span>
                    <span id="curso-preco" class="text-2xl font-black text-emerald-600">R$ 0,00</span>
                </div>
            </div>

            <!-- Meios de Pagamento (Simulação visual Mercado Pago) -->
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-3">Escolha a forma de pagamento (Simulada)</label>
                <div class="grid grid-cols-2 gap-4">
                    <label class="border-2 border-blue-600 bg-blue-50/50 p-4 rounded-xl flex flex-col items-center cursor-pointer">
                        <span class="font-bold text-slate-800 text-sm">Pix Instantâneo</span>
                        <span class="text-xs text-slate-500 mt-1">Liberação imediata</span>
                    </label>
                    <label class="border-2 border-slate-200 p-4 rounded-xl flex flex-col items-center cursor-pointer hover:border-slate-300">
                        <span class="font-bold text-slate-800 text-sm">Cartão de Crédito</span>
                        <span class="text-xs text-slate-500 mt-1">Até 12x</span>
                    </label>
                </div>
            </div>

            <!-- Botão de Simulação -->
            <button id="btn-simular-pagamento" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl text-base transition shadow-lg shadow-emerald-600/20 flex items-center justify-center gap-2">
                <span>Simular Pagamento Aprovado (API MP)</span>
            </button>
        </div>

    </div>

    <script type="module">
        import { supabase } from '../supabase.js';

        const urlParams = new URLSearchParams(window.location.search);
        const cursoId = urlParams.get('id');

        let cursoAtual = null;
        let usuarioAtual = null;

        async function inicializarCheckout() {
            if (!cursoId) {
                alert('Nenhum curso selecionado.');
                window.location.href = 'catalogo-completo.html';
                return;
            }

            // 1. Verifica usuário logado
            const { data: { user }, error: authError } = await supabase.auth.getUser();
            if (authError || !user) {
                window.location.href = '../login.html';
                return;
            }
            usuarioAtual = user;

            // 2. Busca dados do curso
            const { data: curso, error } = await supabase
                .from('cursos')
                .select('*')
                .eq('id', cursoId)
                .single();

            if (error || !curso) {
                alert('Curso não encontrado.');
                window.location.href = 'catalogo-completo.html';
                return;
            }

            cursoAtual = curso;

            // Preenche na tela
            document.getElementById('curso-titulo').textContent = curso.titulo;
            document.getElementById('curso-carga').textContent = `${curso.carga_horaria} Horas`;
            document.getElementById('curso-preco').textContent = `R$ ${(curso.preco || 199.90).toFixed(2).replace('.', ',')}`;

            document.getElementById('loading-curso').classList.add('hidden');
            document.getElementById('detalhes-pedido').classList.remove('hidden');
        }

        // 3. Simulação da Aprovação do Pagamento
        document.getElementById('btn-simular-pagamento').addEventListener('click', async () => {
            const btn = document.getElementById('btn-simular-pagamento');
            btn.disabled = true;
            btn.textContent = 'Processando pagamento simulado...';

            try {
                // Insere a matrícula na tabela progresso_alunos liberando o acesso
                const { error } = await supabase
                    .from('progresso_alunos')
                    .upsert({
                        user_id: usuarioAtual.id,
                        curso_id: cursoAtual.id,
                        status: 'em_andamento',
                        progresso_percentual: 0
                    }, { onConflict: 'user_id, curso_id' });

                if (error) throw error;

                alert('✅ Pagamento Aprovado com Sucesso!\n\n- Matrícula efetuada.\n- Acesso liberado no portal.\n- Notificação enviada via WhatsApp/E-mail.');
                
                // Redireciona para a página do curso recém-adquirido
                window.location.href = `curso.html?id=${cursoAtual.id}`;

            } catch (err) {
                alert('Erro ao processar simulação: ' + err.message);
                btn.disabled = false;
                btn.textContent = 'Simular Pagamento Aprovado (API MP)';
            }
        });

        inicializarCheckout();
    </script>
</body>
</html>
