<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Aluno - UniFATIX</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-lg w-full bg-white rounded-2xl shadow-2xl border border-slate-200 p-8">
        <div class="text-center mb-6">
            <span class="text-2xl font-extrabold text-blue-950 tracking-wide">UniFATIX</span>
            <h1 class="text-xl font-bold text-slate-800 mt-1">Ficha de Cadastro do Estudante</h1>
            <p class="text-xs text-slate-500 mt-1">Preencha seus dados obrigatórios para liberar acesso ao catálogo e matrículas</p>
        </div>

        <form id="form-registro" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Nome Completo *</label>
                <input type="text" id="nome" required placeholder="Nome completo sem abreviações"
                       class="w-full border border-slate-300 rounded-lg px-3.5 py-2 text-sm focus:outline-none focus:border-blue-600">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">CPF *</label>
                    <input type="text" id="cpf" required placeholder="000.000.000-00" maxlength="14"
                           class="w-full border border-slate-300 rounded-lg px-3.5 py-2 text-sm focus:outline-none focus:border-blue-600">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">WhatsApp (com DDD) *</label>
                    <input type="text" id="whatsapp" required placeholder="(00) 90000-0000" maxlength="15"
                           class="w-full border border-slate-300 rounded-lg px-3.5 py-2 text-sm focus:outline-none focus:border-blue-600">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">E-mail Principal *</label>
                <input type="email" id="email" required placeholder="seu@email.com"
                       class="w-full border border-slate-300 rounded-lg px-3.5 py-2 text-sm focus:outline-none focus:border-blue-600">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Crie uma Senha *</label>
                <input type="password" id="senha" required minlength="6" placeholder="Mínimo de 6 caracteres"
                       class="w-full border border-slate-300 rounded-lg px-3.5 py-2 text-sm focus:outline-none focus:border-blue-600">
            </div>

            <button type="submit" id="btn-cadastrar" class="w-full bg-blue-700 hover:bg-blue-800 text-white font-semibold py-2.5 rounded-lg text-sm transition shadow-sm">
                Finalizar Cadastro e Escolher Curso
            </button>
        </form>

        <p class="text-center text-xs text-slate-600 mt-5">
            Já possui cadastro? <a href="login.html" class="text-blue-700 font-bold hover:underline">Entrar no Portal</a>
        </p>
    </div>

    <script type="module">
        import { supabase } from './supabase.js';

        // Máscara simples de CPF
        document.getElementById('cpf').addEventListener('input', (e) => {
            let v = e.target.value.replace(/\D/g, '');
            v = v.replace(/(\d{3})(\d)/, '$1.$2');
            v = v.replace(/(\d{3})(\d)/, '$1.$2');
            v = v.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
            e.target.value = v;
        });

        // Máscara simples de WhatsApp
        document.getElementById('whatsapp').addEventListener('input', (e) => {
            let v = e.target.value.replace(/\D/g, '');
            v = v.replace(/^(\d{2})(\d)/g, '($1) $2');
            v = v.replace(/(\d)(\d{4})$/, '$1-$2');
            e.target.value = v;
        });

        document.getElementById('form-registro').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-cadastrar');
            btn.disabled = true;
            btn.textContent = 'Criando conta...';

            const nome = document.getElementById('nome').value.trim();
            const cpf = document.getElementById('cpf').value.trim();
            const whatsapp = document.getElementById('whatsapp').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('senha').value;

            try {
                // 1. Cria usuário no Supabase Auth
                const { data, error } = await supabase.auth.signUp({
                    email,
                    password,
                    options: {
                        data: {
                            role: 'aluno',
                            name: nome,
                            cpf: cpf,
                            whatsapp: whatsapp
                        }
                    }
                });

                if (error) throw error;

                if (data.user) {
                    // 2. Grava dados na tabela 'perfis'
                    await supabase.from('perfis').upsert([{
                        id: data.user.id,
                        nome_completo: nome,
                        cpf: cpf,
                        whatsapp: whatsapp,
                        email: email
                    }]);

                    alert('Cadastro realizado com sucesso! Escolha agora o curso desejado.');
                    window.location.href = 'cursos/catalogo-completo.html';
                }
            } catch (err) {
                alert('Erro ao cadastrar: ' + err.message);
                btn.disabled = false;
                btn.textContent = 'Finalizar Cadastro e Escolher Curso';
            }
        });
    </script>
</body>
</html>
