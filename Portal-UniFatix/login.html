<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniFATIX | Autenticação</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-branding">
            <h1>ZENTIX <span>Cursos</span></h1>
            <p>Plataforma de Treinamento Corporativo e Qualificação Profissional.</p>
            <div class="branding-features">
                <div>✓ Certificados com Validação por QR Code</div>
                <div>✓ Normas Reguladoras (NR-10, NR-33, NR-35)</div>
                <div>✓ Controle de Acesso Seguro (RBAC)</div>
            </div>
        </div>
        
        <div class="login-form-wrapper">
            <h2>Acesse sua Conta</h2>
            <form id="loginForm">
                <div class="input-group">
                    <label for="email">E-mail ou Matrícula</label>
                    <input type="text" id="email" required placeholder="seu.email@unifatix.edu.br">
                </div>
                <div class="input-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-submit">Entrar no Sistema</button>
            </form>
            <div id="error-message" class="error-msg" style="color: red; margin-top: 10px; display: none;"></div>
        </div>
    </div>

    <!-- Script de Autenticação -->
    <script src="auth.js"></script>
</body>
</html>
