<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniFATIX | Painel Administrativo</title>
    <link rel="stylesheet" href="style.css">
    <!-- Guarda de Autenticação para proteger o painel -->
    <script src="auth-guard.js" defer></script>
</head>
<body>
    <header class="admin-header">
        <h1>Painel de Gestão - UniFATIX</h1>
        <button id="btnLogout" class="btn-logout" onclick="localStorage.removeItem('unifatix_user'); window.location.href='./login.html';">Sair</button>
    </header>
    <main class="admin-container">
        <section class="admin-card">
            <h2>Gerenciamento de Alunos e Cursos</h2>
            <p>Bem-vindo ao painel de controle administrativo. Utilize o menu lateral para gerenciar matrículas, turmas e conteúdos.</p>
        </section>
    </main>
</body>
</html>
